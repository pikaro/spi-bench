[common]
# FIXME: 6.13 causes errors with Python 3.14
build_type = release
upload_speed = 921600
monitor_speed = 921600
monitor_echo = yes
extra_scripts =
    pre:bin/compdb_path.py
    pre:bin/sdkconfig.py
    pre:bin/select_port.py
    pre:bin/build_flags.py
    pre:bin/esp_sr_flash.py
    bin/reset_target.py
    post:bin/esp_sr_models.py
    post:bin/esp_size.py
build_unflags =
    -std=gnu17
    -std=gnu++2b
    -DBOARD_HAS_PIN_REMAP
upload_protocol = esptool
build_flags =
    -std=gnu++23
    -fdiagnostics-format=sarif-file

lib_deps =
    https://github.com/Neargye/magic_enum#v0.9.7
    https://github.com/d-bahr/CRCpp#release-1.2.1.0

[esp32]
extends = common

build_flags =
    ${common.build_flags}
    -DPLATFORM_ESP32
    -DESP32_CMAKE

board_build.cmake_extra_args =
    -DENABLE_SPI=OFF
    -DENABLE_I2C=OFF
    -DENABLE_I2S=OFF
    -DENABLE_PSRAM=OFF
    -DENABLE_LEDC=OFF
    -DENABLE_ADC=OFF
    -DENABLE_TEMP_SENSOR=OFF
    -DENABLE_TWAI=OFF
    -DENABLE_SDMMC=OFF
    -DENABLE_WIFI=OFF
    -DENABLE_BLUETOOTH=OFF
    -DENABLE_HTTPD=OFF
    -DENABLE_ESP_SR=OFF
board_build.filesystem = littlefs

platform = espressif32@6.12
framework = espidf
monitor_filters = esp32_exception_decoder

[esp32orig]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DPLATFORM_ESP32_ORIG
    -mtext-section-literals
board = custom_esp32_nodemcu
board_build.partitions = partitions/esp32_4mib.csv

[esp32s3]
extends = esp32

board_build.cmake_extra_args =
    ${esp32.board_build.cmake_extra_args}
    -DENABLE_PSRAM=ON

[esp32s3n16r8]
extends = esp32s3

[esp32s3fh4r2]
extends = esp32s3

[esp32c3]
extends = esp32

[esp32s3nano]
extends = esp32s3n16r8
board = custom_esp32s3_nano
board_build.partitions = partitions/esp32_16mib.csv

build_flags =
    ${esp32.build_flags}
    -DPLATFORM_ESP32S3
    -DPLATFORM_ESP32S3_NANO
    -DBOARD_HAS_PSRAM
    -mtext-section-literals
# FIXME: Readd?
# -mfix-esp32-psram-cache-issue

[esp32s3zero]
extends = esp32s3fh4r2
board = custom_esp32s3_zero
board_build.partitions = partitions/esp32_4mib.csv

build_flags =
    ${esp32.build_flags}
    -DPLATFORM_ESP32S3
    -DPLATFORM_ESP32S3_ZERO
    -DBOARD_HAS_PSRAM
    -mtext-section-literals
# FIXME: Readd?
# -mfix-esp32-psram-cache-issue

[esp32s3devkit]
extends = esp32s3n16r8
board = custom_esp32s3_devkit
board_build.partitions = partitions/esp32_16mib.csv

build_flags =
    ${esp32.build_flags}
    -DPLATFORM_ESP32S3
    -DPLATFORM_ESP32S3_DEVKIT
    -DBOARD_HAS_PSRAM
    -mtext-section-literals

[esp32c3supermini]
extends = esp32c3
board = custom_esp32c3_supermini
board_build.partitions = partitions/esp32_4mib.csv

build_flags =
    ${esp32.build_flags}
    -DPLATFORM_ESP32C3
    -DPLATFORM_ESP32C3_SUPERMINI

[nrf52840]
extends = common

[seeed-sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
extends = nrf52840
; WARNING: Needs `nrf` in name
board = custom_seeed_sense_nrf52840
framework = zephyr
custom_reset_protocol = jlink
platform_packages =
    platformio/tool-jlink@^1.92000.0

[platformio]
build_dir = ${PROJECT_DIR}/build
data_dir = ${PROJECT_DIR}/data/${PIOENV}/littlefs

[env:master]
extends = esp32s3zero
build_flags =
    ${esp32s3zero.build_flags}
    -DNODE_IDENTITY=Master
board_build.cmake_extra_args =
    ${esp32s3zero.board_build.cmake_extra_args}
    -DSRC_ROOT:STRING="master"
    -DENABLE_SPI=ON
custom_usb_serials =
    D4:05:92:41:EA:FC
; AC:A7:04:29:85:84
; E0:72:A1:A9:58:9C
; 5B7A153806

[env:media]
extends = esp32s3zero
build_flags =
    ${esp32s3zero.build_flags}
    -DESP32
    -DNODE_IDENTITY=Media
    -DCOPY_LOG_OFF
    -DUSE_AUDIOTOOLS_NS=0
    -DCONFIG_IDF_TARGET_ESP32=1
    -I.pio/libdeps/media/audio-tools/src
board_build.cmake_extra_args =
    ${esp32orig.board_build.cmake_extra_args}
    -DSRC_ROOT:STRING="media"
    -DENABLE_SPI=ON
    -DENABLE_I2C=ON
    -DENABLE_I2S=ON
    -DENABLE_LEDC=ON
    -DENABLE_BLUETOOTH=OFF
custom_usb_serials =
    D4:05:92:42:01:C4
lib_ldf_mode = off
lib_deps =
    ${common.lib_deps}
    git+ssh://git@github.com/pschatzmann/arduino-audio-tools#v1.2.2

[env:gpu0]
extends = esp32s3zero
build_flags =
    ${esp32s3zero.build_flags}
    -DNODE_IDENTITY=GPUNode0
    -DESP32
    -DLED_GROUP_COUNT=4
    -DLED_GROUP_INDEX=0
    -DLED_NODE_GROUP_COUNT=2
    -DLED_NODE_GROUP0=0
    -DLED_NODE_GROUP1=2
    -DLED_DATA_LINE_COUNT=2
board_build.cmake_extra_args =
    ${esp32s3zero.board_build.cmake_extra_args}
    -DSRC_ROOT:STRING="gpu"
    -DENABLE_SPI=ON
custom_usb_serials =
    9C:13:9E:F1:3F:60
custom_sdkconfig = gpu
lib_deps =
    ${common.lib_deps}
    fastled/FastLED @ ^3.10.3
lib_compat_mode = off

[env:gpu1]
extends = esp32s3zero
build_flags =
    ${esp32s3zero.build_flags}
    -DNODE_IDENTITY=GPUNode1
    -DESP32
    -DLED_GROUP_COUNT=4
    -DLED_GROUP_INDEX=1
    -DLED_NODE_GROUP_COUNT=2
    -DLED_NODE_GROUP0=1
    -DLED_NODE_GROUP1=3
    -DLED_DATA_LINE_COUNT=2
board_build.cmake_extra_args =
    ${esp32s3zero.board_build.cmake_extra_args}
    -DSRC_ROOT:STRING="gpu"
    -DENABLE_SPI=ON
custom_usb_serials =
    10:51:DB:5E:FA:1C
custom_sdkconfig = gpu
lib_deps =
    ${common.lib_deps}
    fastled/FastLED @ ^3.10.3
lib_compat_mode = off

[env:io]
extends = esp32c3supermini
build_flags =
    ${esp32c3supermini.build_flags}
    -DNODE_IDENTITY=InputOutput
board_build.cmake_extra_args =
    ${esp32c3supermini.board_build.cmake_extra_args}
    -DSRC_ROOT:STRING="io"
    -DENABLE_LEDC=ON
    -DENABLE_BLUETOOTH=ON
custom_usb_serials =
    80:F1:B2:6F:1A:38
; 80:F1:B2:8B:0C:1C\

[env:wheel]
extends = seeed-sense
custom_usb_serials =
    A43F01C3C1D8BE9E
    8DB6E38E387CF6FB

[env:ai]
extends = esp32s3nano
board_build.partitions = partitions/esp32_16mib_ai.csv
build_flags =
    ${esp32s3nano.build_flags}
    -DESP32
    -DNODE_IDENTITY=AI
    -DCOPY_LOG_OFF
    -DUSE_AUDIOTOOLS_NS=0
    -I.pio/libdeps/media/audio-tools/src
board_build.cmake_extra_args =
    ${esp32s3nano.board_build.cmake_extra_args}
    -DENABLE_PSRAM=ON
    -DENABLE_WIFI=ON
    -DENABLE_I2S=ON
    -DENABLE_ESP_SR=ON
    -DSRC_ROOT:STRING="ai"
custom_usb_serials =
    48CA432F0274
    48:CA:43:2F:02:74
    48CA432F8A8C
    48:CA:43:2F:8A:8C
lib_deps =
    ${common.lib_deps}
    git+ssh://git@github.com/pschatzmann/arduino-audio-tools#v1.2.2

[env:power]
extends = esp32c3supermini
build_flags =
    ${esp32c3supermini.build_flags}
    -DNODE_IDENTITY=Power
board_build.cmake_extra_args =
    ${esp32c3supermini.board_build.cmake_extra_args}
    -DSRC_ROOT:STRING="power"
custom_usb_serials =
    80:F1:B2:8B:0B:F0

[env:scratch]
extends = esp32c3supermini
build_flags =
    ${esp32c3supermini.build_flags}
    -DNODE_IDENTITY=Scratch
board_build.cmake_extra_args =
    ${esp32c3supermini.board_build.cmake_extra_args}
    -DSRC_ROOT:STRING="scratch"
    -DENABLE_I2C=ON
custom_usb_serials =
    80:F1:B2:8B:09:48

